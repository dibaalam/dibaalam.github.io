<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {% if page.destinations %}
      {% include header-flight.html %}
    {% else %}
      {% include header.html %}
    {% endif %}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {% unless page.hide_footer %}
      {% include footer.html %}
    {% endunless %}

  </body>

</html>
