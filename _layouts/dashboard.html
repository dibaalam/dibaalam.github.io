<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

  {%- include head.html -%}

  <body>

    <div class="dashboard-container">

      <aside class="sidebar">
        <div class="sidebar-brand">
          <span>P A</span>
          <span>S I</span>
        </div>

        <nav class="sidebar-nav">
          <a href="#" class="ribbon-btn passport">PASSPORT</a>
          <a href="#" class="ribbon-btn trips">TRIPS</a>
          <a href="#" class="ribbon-btn gallery">GALLERY</a>
        </nav>

        <div class="sidebar-footer">
          <button class="icon-btn home-btn" aria-label="Home">🏠</button>
          <button class="icon-btn pin-btn" aria-label="Center Globe">📍</button>
          <button class="icon-btn theme-btn" aria-label="Toggle Theme">💡</button>
        </div>
      </aside>

      <main class="main-content">
        <div id="globe-viewport">
          <div id="globeViz" style="width: 100%; height: 100%; background: transparent;"></div>
        </div>
      </main>

    </div>

    <script id="travel-data" type="application/json">
      [
        {% for trip in site.data.travels %}
        { 
          "city": {{ trip.city | jsonify }}, 
          "lat": {{ trip.lat | default: 0 }}, 
          "lng": {{ trip.lng | default: 0 }}, 
          "label": {{ trip.code | jsonify }},
          "iso": {{ trip.iso | jsonify }}
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    </script>

    <script src="//cdn.jsdelivr.net/npm/globe.gl"></script>

    <script type="module" src="{{ '/assets/js/dashboard-globe.js' | relative_url }}"></script>

  </body>
</html>
