<div class="blog-entry-wrapper">
    <div class="luggage-box theme-{{ include.color }}">
        <img src="{{ include.image | relative_url }}" alt="{{ include.title }}">
    </div>

    <a href="{{ include.url | relative_url }}" class="boarding-pass theme-{{ include.color }}">
        <header class="series-banner">
            <div class="banner-left">
                <span class="series-name"><i>{{ include.category }}</i></span>
                <span class="flight-num">FLIGHT #{{ include.index | prepend: '00' | slice: -3, 3 }}</span>
            </div>
            <div class="banner-right">
                <span class="boarding-text">BOARDING PASS</span>
            </div>
        </header>
        
        <div class="pass-body">
            <div class="main-info">
                <h2 class="post-title">{{ include.title }}</h2>
                <hr class="pass-divider">
                <p class="post-description">{{ include.description }}</p>
            </div>
            
            <div class="pass-stub">
                <div class="metadata-grid">
                    <div class="meta-item"><span>SEAT</span><strong>{{ include.date | date: "%d" }}</strong></div>
                    <div class="meta-item"><span>GATE</span><strong>{{ include.date | date: "%b" | upcase }}</strong></div>
                    <div class="meta-item"><span>TERMINAL</span><strong>{{ include.date | date: "%Y" }}</strong></div>
                </div>
                <div class="airport-codes">
                    <span>YYZ</span> <span class="plane-icon">✈️</span> <span>END</span>
                </div>
                <div class="barcode-area"></div>
            </div>
        </div>
    </a>
</div>
